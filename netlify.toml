[build]
  command = "node scripts/build-netlify.mjs"
  publish = "apps/web/out"
  functions = "apps/api/netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.25.0"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "zisi"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
